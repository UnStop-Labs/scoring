[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irrigation-subnet"
version = "1.0.0"
description = "Field Irrigation Intelligence Network — Bittensor subnet for geospatial soil moisture analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Irrigation Subnet Team"}
]

[project.optional-dependencies]
miner = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.25.2",
    "loguru>=0.7.2",
    "numpy>=1.24.0",
    "shapely>=2.0.0",
    "pystac-client>=0.7.0",
    "planetary-computer>=1.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",
    "aiohttp>=3.9.1",
    "PyYAML>=6.0.1",
    "bt-decode==0.5.0a2",
    "async-substrate-interface==1.0.0",
    "fiber[full] @ git+https://github.com/rayonlabs/fiber.git@2.3.0#egg=fiber"
]
validator = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.25.2",
    "loguru>=0.7.2",
    "numpy>=1.24.0",
    "shapely>=2.0.0",
    "sqlalchemy>=2.0.23",
    "aiohttp>=3.9.1",
    "pyproj>=3.6.0",
    "PyYAML>=6.0.1",
    "scipy>=1.11.0",
    "substrate-interface>=1.7.4",
    "bt-decode>=0.5.0a2",
    "async-substrate-interface>=1.0.0",
    "fiber[full] @ git+https://github.com/rayonlabs/fiber.git@2.5.0#egg=fiber"
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["miner", "validator"]
